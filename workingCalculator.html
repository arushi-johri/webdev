<html>
  <head>
    <title>Calculator</title>
    <style>
      #calcBody{
        width:400px;
        height:600px;
        border-radius:5px;
        background-color:black;
        padding:30px;
      }
      #inputbox{
        background-color: white;
        border-radius:5px;
        width:390px;
        height:80px;
        font-size:30px;
      }
      button{
        margin-top:20px;
        padding:20px;
        width:95px;
        height:80px;
        background-color:lightgray;
        border-radius:10px;
        font-size:20px;
      }
    </style>
  </head>
  <body>
    <div id="calcBody">
      <input type="text" id="inputbox">
      <div>
        <button type="button" onclick="appendValue('7')">7</button>
        <button type="button" onclick="appendValue('8')">8</button>
        <button type="button" onclick="appendValue('9')">9</button>
        <button type="button" onclick="appendValue('+')" style="background-color: orange;">+</button>
      </div>
      <div>
        <button type="button" onclick="appendValue('4')">4</button>
        <button type="button" onclick="appendValue('5')">5</button>
        <button type="button" onclick="appendValue('6')">6</button>
        <button type="button" onclick="appendValue('-')" style="background-color: orange;">-</button>
      </div>
      <div>
        <button type="button" onclick="appendValue('1')">1</button>
        <button type="button" onclick="appendValue('2')">2</button>
        <button type="button" onclick="appendValue('3')">3</button>
        <button type="button" onclick="appendValue('*')" style="background-color: orange;">*</button>
      </div>
      <div>
        <button type="button" onclick="appendValue('0')">0</button>
        <button type="button" onclick="appendValue('.')">.</button>
        <button type="button" onclick="appendValue('/')" style="background-color: orange;">/</button>
        <button type="button" onclick="appendValue('%')" style="background-color: orange;">%</button>
      </div>
      <div style="display:flex; justify-content:center;">
        <button type="button" onclick="clearData()" style="background-color: green;">C</button>
        <button type="button" onclick="result()">=</button>
      </div>
      <script>
        let val = document.getElementById('inputbox');
        function appendValue(symbol){
          inputbox.value += symbol;
        }
        function clearData(){
          inputbox.value = "";
        }
        function result(){
          try{
            inputbox.value = eval(inputbox.value);
          }
          catch{
            inputbox.value = "Error";
          }
        }
      </script>
    </div>
  </body>
</html>
